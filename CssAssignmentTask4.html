<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .sidenav {
      position: fixed;
      top: 0;
      left: 0;
      width: 60px;
      height: 100%;
      overflow-x: hidden;
      transition: width 0.3s;
    }
    .sidenav a {
      display: block;
      width: 60px;
      height: 60px;
      line-height: 60px;
      color: #fff;
      text-decoration: none;
      text-indent: -999px;      
      white-space: nowrap;
      overflow: hidden;
      transition: width 0.3s, text-indent 0.3s, padding-left 0.3s;
      margin-bottom: 10px;
    }
    .sidenav a.green  { background: #4CAF50; }
    .sidenav a.blue   { background: #2196F3; }
    .sidenav a.red    { background: #f44336; }
    .sidenav a.gray   { background: #555; }

    .sidenav a:hover {
      width: 200px;
      text-indent: 0;
      padding-left: 20px;
    }

    .main {
      margin-left: 60px;
      padding: 20px;
    }
  </style>
    </style>
</head>
<body>
    <h1>Task 4</h1>
    <div class="sidenav">
        <a href="#" class="green">Green Button</a>
        <a href="#" class="blue">Blue Button</a>
        <a href="#" class="red">Red Button</a>
        <a href="#" class="gray">Gray Button</a>
      </div>
    
      <div class="main">
        <h2>Hoverable Sidenav Buttons</h2>
        <p>Hover over the buttons in the left side navigation to open them.</p>
      </div>
</body>
</html>
