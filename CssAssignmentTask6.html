<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * { box-sizing: border-box; }
        body {
          margin: 0;
          font-family: Arial, sans-serif;
          background: #d6d92c; 
        }

        nav {
          float: left;
          width: 200px;
          padding-top: 40px;
        }
        nav a {
          display: block;
          background: #fff;
          color: #00f;
          text-decoration: none;
          padding: 8px 12px;
          margin: 8px;
          border-right: 10px solid #000;
        }

        main {
          margin-left: 200px;
          padding: 40px;
        }
        main h1 {
          color: purple;
          margin-bottom: 20px;
        }
        main p {
          margin-bottom: 16px;
          color: #333;
        }
        main em {
          display: block;
          margin-top: 30px;
          font-style: italic;
          color: #555;
        }
      </style>
</head>
<body>
    <nav>
        <a href="#">Home page</a>
        <a href="#">Musings</a>
        <a href="#">My town</a>
        <a href="#">Links</a>
      </nav>
    
      <main>
        <h1>My first styled page</h1>
        <p>Welcome to my styled page!</p>
        <p>It lacks images, but at least it has style. And it has links, even if they don’t go anywhere…</p>
        <p>There should be more here, but I don’t know what yet.</p>
        <em>Made 5 April 2004 by myself.</em>
      </main>
</body>
</html>
