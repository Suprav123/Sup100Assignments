<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
    
    .vnav, .hnav {
      margin-top: 20px;
      padding: 10px;
    }
    .vnav a {
      display: block;
      padding: 10px;
      text-decoration: none;
    }
    .vnav .home { background: orange; color: white; }
    .vnav .others { background: lightblue; color: blue; }
    .hnav a {
      display: inline-block;
      padding: 10px;
      text-decoration: none;
      border: 1px solid grey;
    }
    .hnav .home { background: black; color: white; }
    .hnav .others { color: blue; }

    </style>
</head>
<body>
  <h1>Task 2</h1>
  <div class="vnav">
    <strong>Vertical Navigation Bar</strong><br>
    <a href="#" class="home">Home</a>
    <a href="#" class="others">Java</a>
    <a href="#" class="others">CSS</a>
    <a href="#" class="others">HTML</a>
    <a href="#" class="others">Bootstrap</a>
  </div>
  <div class="hnav">
    <strong>Horizontal Navigation Bar</strong><br>
    <a href="#" class="home">Home</a>
    <a href="#" class="others">Java</a>
    <a href="#" class="others">HTML</a>

  </div>
