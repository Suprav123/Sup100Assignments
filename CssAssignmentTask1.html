<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pill-shaped Table</title>
  <title>Border-Radius Gallery</title>
  <style>
    
    th, td {
      background-color: #66cccc;
      padding: 0.75em 1.5em;
      border: 2px solid #000;
      border-radius: 1em;         
      text-align: center;
      
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 160px);
      grid-auto-rows: 100px;
      gap: 20px;
      justify-content: center;
      padding: 40px;
    }

    .box {
      border: 4px solid #8bc53f;
      background: white;
    }

    .r1  { border-radius: 10px; }            
    .r2  { border-radius: 20px; }            
    .r3  { border-radius: 30px; }            
    .r4  { border-radius: 20px; }       
    .r5  { border-radius: 5px; }       
    .r6  { border-radius: 30px; }    
    .r7  { border-radius: 50%; }         
    .r8  { border-radius: 5px; }       
    .r9  { border-radius: 0  30px; }    
  </style>

  </style>
</head>
<body>
<h1>Task 1</h1>

  <table>
    <tr>
      <th>Firstname</th>
      <th>Lastname</th>
      <th>Age</th>
    </tr>
    <tr>
      <td>Jill</td>
      <td>Smith</td>
      <td>50</td>
    </tr>
    <tr>
      <td>Eve</td>
      <td>Jackson</td>
      <td>94</td>
    </tr>
    <tr>
      <td>John</td>
      <td>Doe</td>
      <td>80</td>
    </tr>
  </table>

  <div class="grid">
    <div class="box r1"></div>
    <div class="box r2"></div>
    <div class="box r3"></div>

    <div class="box r4"></div>
    <div class="box r5"></div>
    <div class="box r6"></div>

    <div class="box r7"></div>
    <div class="box r8"></div>
    <div class="box r9"></div>
  </div>


</body>
</html>
